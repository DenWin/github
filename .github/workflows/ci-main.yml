name: CI main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-main-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full-checks:
    permissions:
      contents: read
    timeout-minutes: 15
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install verified modules and run full checks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $modules = Join-Path $env:RUNNER_TEMP 'verified-powershell-modules'
          ./Install-DevelopmentDependencies.ps1 -Destination $modules
          $env:PSModulePath = "$modules$([System.IO.Path]::PathSeparator)$env:PSModulePath"
          ./Invoke-Checks.ps1 -Full

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-main-${{ matrix.os }}
          path: TestResults/
          retention-days: 7
          include-hidden-files: false

  proof:
    permissions:
      contents: read
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install verified modules and prove tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $modules = Join-Path $env:RUNNER_TEMP 'verified-powershell-modules'
          ./Install-DevelopmentDependencies.ps1 -Destination $modules
          $env:PSModulePath = "$modules$([System.IO.Path]::PathSeparator)$env:PSModulePath"
          ./Invoke-Checks.ps1 -SkipLint -SkipTests -Proof

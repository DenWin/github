name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    permissions:
      contents: read
    timeout-minutes: 15
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install modules
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dependencies = Import-PowerShellDataFile .\DevelopmentDependencies.psd1
          foreach ($module in $dependencies.Keys) {
            Install-Module -Name $module -RequiredVersion $dependencies[$module] -Repository PSGallery -Scope CurrentUser -Force
          }

      - name: Lint and test
        shell: pwsh
        run: ./Invoke-Checks.ps1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/
          retention-days: 7
          include-hidden-files: false
